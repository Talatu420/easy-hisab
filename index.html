<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokda Flow - Smart Expense Manager</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230f172a'/%3E%3Ctext x='20' y='27' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='21' fill='%2338bdf8'%3E%E2%82%B9%3C/text%3E%3Cpath d='M6 31 Q13 27 20 31 T34 31' stroke='%2338bdf8' stroke-width='2.2' fill='none' stroke-linecap='round' opacity='0.85'/%3E%3C/svg%3E">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase (compat SDKs) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.theme-light {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.theme-light .card-3d {
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        body.theme-light header {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: #e2e8f0;
            color: #0f172a;
        }
        body.theme-light .bg-custom-card {
            background-color: #f8fafc;
            border-color: rgba(226, 232, 240, 0.6);
        }
        body.theme-light .input-custom {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #0f172a;
        }
        body.theme-light .modal-bg {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        body.theme-dark {
            background-color: #0b0f19;
            color: #f8fafc;
        }
        body.theme-dark .card-3d {
            background: #1e293b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        body.theme-dark header {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: #334155;
            color: #f8fafc;
        }
        body.theme-dark .bg-custom-card {
            background-color: #0f172a;
            border-color: rgba(51, 65, 85, 0.6);
            color: #f8fafc;
        }
        body.theme-dark .input-custom {
            background-color: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        body.theme-dark .modal-bg {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
        }

        .card-3d {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        .card-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
        }
        .btn-black {
            background: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            transition: all 0.2s ease;
        }
        body.theme-dark .btn-black {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
        .btn-black:hover {
            opacity: 0.9;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .btn-black:active {
            transform: translateY(2px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        /* ---- 3D auth screen styling ---- */
        .auth-card-3d {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow:
                0 30px 60px -15px rgba(15, 23, 42, 0.25),
                0 15px 25px -10px rgba(56, 189, 248, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: perspective(1000px) rotateX(1deg);
        }
        body.theme-dark .auth-card-3d {
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.5),
                0 15px 25px -10px rgba(56, 189, 248, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .badge-3d {
            background: linear-gradient(135deg, #1e293b, #38bdf8);
            box-shadow:
                0 10px 20px -6px rgba(15, 23, 42, 0.5),
                0 4px 8px -2px rgba(56, 189, 248, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -2px 4px rgba(0, 0, 0, 0.25);
        }

        .btn-3d-secondary {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #334155;
            font-weight: 600;
            font-size: 11px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }
        .btn-3d-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
        }
        .btn-3d-secondary:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        body.theme-dark .btn-3d-secondary {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #cbd5e1;
            border: 1px solid #475569;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        body.theme-dark .btn-3d-secondary:hover {
            background: linear-gradient(135deg, #475569, #334155);
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="theme-light min-h-screen pb-24">

    <!-- Auth Screen (Sign Up / Sign In) -->
    <div id="auth-screen" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-50">
        <div class="auth-card-3d w-full max-w-sm p-6 rounded-3xl space-y-4">
            <div class="text-center space-y-2">
                <div class="badge-3d w-14 h-14 mx-auto rounded-2xl flex items-center justify-center">
                    <svg viewBox="0 0 40 40" class="w-8 h-8" xmlns="http://www.w3.org/2000/svg">
                        <text x="20" y="27" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="21" fill="white">₹</text>
                        <path d="M6 31 Q13 27 20 31 T34 31" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
                    </svg>
                </div>
                <h2 class="text-xl font-extrabold tracking-tight">Rokda Flow</h2>
                <p id="auth-subtitle" class="text-xs opacity-60">Sign in to access your transactions</p>
            </div>

            <!-- Tabs for Sign In / Sign Up -->
            <div class="grid grid-cols-2 gap-1 bg-slate-200/50 p-1 rounded-xl border border-slate-300/40">
                <button type="button" id="tab-signin" onclick="switchAuthTab('signin')" class="py-2 text-xs font-semibold rounded-lg transition cursor-pointer bg-white shadow-sm">Sign In</button>
                <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 text-xs font-semibold rounded-lg transition cursor-pointer opacity-70 hover:opacity-100">Sign Up</button>
            </div>

            <div id="auth-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs p-2.5 rounded-xl"></div>
            <div id="auth-success" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-2.5 rounded-xl"></div>

            <!-- Email Sign In / Sign Up Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] font-medium opacity-80">Email</label>
                    <input type="email" id="auth-email" required placeholder="you@example.com" class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                </div>
                <div id="password-field-wrapper">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[11px] font-medium opacity-80">Password</label>
                    </div>
                    <input type="password" id="auth-password" required minlength="6" placeholder="At least 6 characters" class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full btn-black font-semibold py-3 rounded-xl text-xs transition tracking-wide cursor-pointer">
                    Sign In
                </button>
                
                <!-- Forgot Password Button -->
                <button type="button" id="forgot-password-link" onclick="toggleForgotPassword(true)" class="btn-3d-secondary cursor-pointer">
                    Forgot Password?
                </button>

                <button type="button" id="back-to-signin-btn" onclick="toggleForgotPassword(false)" class="w-full text-xs opacity-70 underline cursor-pointer hidden text-center pt-1">
                    Back to Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Main App (hidden until signed in) -->
    <div id="main-app" class="hidden">

    <!-- App Header -->
    <header class="backdrop-blur-md p-4 sticky top-0 z-50 shadow-sm flex justify-between items-center border-b">
        <div class="flex items-center gap-2.5">
            <div class="badge-3d w-8 h-8 rounded-xl flex items-center justify-center shrink-0">
                <svg viewBox="0 0 40 40" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg">
                    <text x="20" y="27" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="21" fill="white">₹</text>
                    <path d="M6 31 Q13 27 20 31 T34 31" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
                </svg>
            </div>
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight flex items-center gap-1.5 leading-none">
                <span id="app-title">Rokda Flow</span>
                <span id="sync-status" class="text-[10px] font-normal opacity-50 ml-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="animate-spin"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path stroke-linecap="round" d="M21 12a9 9 0 00-9-9"/></svg> syncing...
                </span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="handleLogout()" title="Log out" class="w-9 h-9 rounded-full bg-slate-200/50 hover:bg-slate-200 flex items-center justify-center border border-slate-300/50 shadow-sm transition cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H3"/></svg>
            </button>
            <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-slate-200/50 hover:bg-slate-200 flex items-center justify-center border border-slate-300/50 shadow-sm transition cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-sm sm:max-w-xl md:max-w-4xl lg:max-w-6xl mx-auto p-4 space-y-5">

        <!-- Budget Warning Alert Banner -->
        <div id="budget-alert" class="hidden bg-rose-50 border-l-4 border-rose-600 text-rose-800 p-3 rounded-xl text-sm flex items-center gap-3 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="text-xl text-rose-600"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            <span id="alert-text">Alert: Your expenses are nearing the budget limit!</span>
        </div>

        <!-- Top Balance Card -->
        <div class="card-3d p-6 rounded-3xl space-y-3 relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-slate-400/20 rounded-full blur-2xl"></div>
            <p id="lbl-balance" class="text-xs uppercase tracking-wider font-semibold opacity-70">Total Available Balance</p>
            <h2 id="total-balance" class="text-3xl sm:text-4xl font-extrabold tracking-tight">₹0.00</h2>
            
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-200/40">
                <div class="bg-custom-card p-3 rounded-2xl border">
                    <p id="lbl-income" class="text-[11px] text-emerald-600 font-semibold flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m0 0l-6-6m6 6l6-6"/></svg> Income</p>
                    <p id="total-income" class="text-base sm:text-lg font-bold text-emerald-600">₹0.00</p>
                </div>
                <div class="bg-custom-card p-3 rounded-2xl border">
                    <p id="lbl-expense" class="text-[11px] text-rose-600 font-semibold flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19.5v-15m0 0l-6 6m6-6l6 6"/></svg> Expense</p>
                    <p id="total-expense" class="text-base sm:text-lg font-bold text-rose-600">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- Responsive Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

            <!-- Left Column: Transaction Form -->
            <div class="card-3d p-5 rounded-3xl space-y-3 h-fit">
                <h3 id="form-heading" class="text-sm font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="text-lg"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Add New Transaction
                </h3>
                
                <form id="expense-form" onsubmit="addTransaction(event)" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label id="lbl-type" class="text-[11px] font-medium opacity-80">Type</label>
                            <select id="type" class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                        <div>
                            <label id="lbl-amount" class="text-[11px] font-medium opacity-80">Amount (₹)</label>
                            <input type="number" id="amount" step="any" placeholder="0.00" required class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label id="lbl-category" class="text-[11px] font-medium opacity-80">Category</label>
                            <select id="category" class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                                <option value="Food">🍔 Food</option>
                                <option value="Grocery">🛒 Grocery</option>
                                <option value="Rent">🏠 Rent</option>
                                <option value="Transport">🚗 Transport</option>
                                <option value="Electricity">💡 Electricity</option>
                                <option value="Recharge">📱 Recharge</option>
                                <option value="Medical">💊 Medical</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Entertainment">🎬 Entertainment</option>
                                <option value="Education">🎓 Education</option>
                                <option value="EMI">💳 EMI</option>
                                <option value="Salary">💰 Salary</option>
                                <option value="Other">📌 Other</option>
                            </select>
                        </div>
                        <div>
                            <label id="lbl-date" class="text-[11px] font-medium opacity-80">Date</label>
                            <input type="date" id="date" required class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                        </div>
                    </div>

                    <!-- Payment Method Field -->
                    <div class="space-y-1">
                        <label id="lbl-payment" class="text-[11px] font-medium opacity-80">Payment Method</label>
                        <select id="paymentMethod" class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                            <option value="UPI">📱 UPI (GPay / PhonePe / Paytm)</option>
                            <option value="Cash">💵 Cash</option>
                            <option value="Bank Transfer">🏦 Bank Transfer / NEFT</option>
                            <option value="Credit/Debit Card">💳 Credit / Debit Card</option>
                        </select>
                    </div>

                    <div>
                        <label id="lbl-desc" class="text-[11px] font-medium opacity-80">Description / Note (Optional)</label>
                        <input type="text" id="desc" placeholder="Write extra note here..." class="input-custom w-full border rounded-xl p-2.5 text-xs focus:outline-none shadow-inner">
                    </div>

                    <button type="submit" id="btn-save" class="w-full btn-black font-semibold py-3 rounded-xl text-xs transition tracking-wide cursor-pointer">
                        Save Transaction <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="ml-1"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
                    </button>
                </form>
            </div>

            <!-- Right Column: Analytics & History Section -->
            <div class="space-y-5">
                <!-- Analytics Section -->
                <div class="card-3d p-5 rounded-3xl space-y-3">
                    <h3 id="analytics-heading" class="text-sm font-bold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="text-lg"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z"/></svg> Expense Analytics
                    </h3>
                    <div class="relative h-56 flex justify-center items-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <!-- History & Filters Section -->
                <div class="card-3d p-5 rounded-3xl space-y-3">
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <h3 id="history-heading" class="text-sm font-bold flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em" class="text-lg"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg> History
                        </h3>
                        <select id="filter-category" onchange="renderTransactions()" class="input-custom border rounded-xl px-2.5 py-1.5 text-xs focus:outline-none shadow-inner">
                            <option value="All">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Grocery">Grocery</option>
                            <option value="Rent">Rent</option>
                            <option value="Transport">Transport</option>
                            <option value="Electricity">Electricity</option>
                            <option value="Recharge">Recharge</option>
                            <option value="Medical">Medical</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="EMI">EMI</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>

        function switchAuthTab(mode) {
            authMode = mode;
            isForgotPasswordMode = false;
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('auth-success').classList.add('hidden');
            
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('auth-submit-btn');
            const forgotLink = document.getElementById('forgot-password-link');
            const backBtn = document.getElementById('back-to-signin-btn');
            const passWrapper = document.getElementById('password-field-wrapper');

            passWrapper.classList.remove('hidden');
            document.getElementById('auth-password').required = true;
            backBtn.classList.add('hidden');

            if (mode === 'signin') {
                tabSignin.className = "py-2 text-xs font-semibold rounded-lg transition cursor-pointer bg-white shadow-sm";
                tabSignup.className = "py-2 text-xs font-semibold rounded-lg transition cursor-pointer opacity-70 hover:opacity-100";
                document.getElementById('auth-subtitle').innerText = 'Sign in to access your transactions';
                submitBtn.innerText = 'Sign In';
                forgotLink.classList.remove('hidden');
            } else {
                tabSignup.className = "py-2 text-xs font-semibold rounded-lg transition cursor-pointer bg-white shadow-sm";
                tabSignin.className = "py-2 text-xs font-semibold rounded-lg transition cursor-pointer opacity-70 hover:opacity-100";
                document.getElementById('auth-subtitle').innerText = 'Create an account to get started';
                submitBtn.innerText = 'Sign Up';
                forgotLink.classList.add('hidden');
            }
        }

        function toggleForgotPassword(val) {
            isForgotPasswordMode = val;
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('auth-success').classList.add('hidden');
            const passFieldWrapper = document.getElementById('password-field-wrapper');
            const forgotLink = document.getElementById('forgot-password-link');
            const backBtn = document.getElementById('back-to-signin-btn');
            const submitBtn = document.getElementById('auth-submit-btn');
            const tabContainer = document.querySelector('#auth-screen .grid-cols-2');

            if (val) {
                passFieldWrapper.classList.add('hidden');
                document.getElementById('auth-password').required = false;
                forgotLink.classList.add('hidden');
                backBtn.classList.remove('hidden');
                tabContainer.classList.add('hidden');
                submitBtn.innerText = 'Send Reset Instructions';
                document.getElementById('auth-subtitle').innerText = 'Enter your email to reset password';
            } else {
                passFieldWrapper.classList.remove('hidden');
                document.getElementById('auth-password').required = true;
                backBtn.classList.add('hidden');
                tabContainer.classList.remove('hidden');
                submitBtn.innerText = authMode === 'signin' ? 'Sign In' : 'Sign Up';
                document.getElementById('auth-subtitle').innerText = authMode === 'signin' ? 'Sign in to access your transactions' : 'Create an account to get started';
                if (authMode === 'signin') {
                    forgotLink.classList.remove('hidden');
                }
            }
        }

        function showAuthError(err) {
            const el = document.getElementById('auth-error');
            el.innerText = err.message || 'Something went wrong. Please try again.';
            el.classList.remove('hidden');
            document.getElementById('auth-success').classList.add('hidden');
        }

        function showAuthSuccess(msg) {
            const el = document.getElementById('auth-success');
            el.innerText = msg;
            el.classList.remove('hidden');
            document.getElementById('auth-error').classList.add('hidden');
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('auth-success').classList.add('hidden');

            const email = document.getElementById('auth-email').value.trim();
            const btn = document.getElementById('auth-submit-btn');

            if (isForgotPasswordMode) {
                btn.disabled = true;
                auth.sendPasswordResetEmail(email)
                    .then(() => {
                        showAuthSuccess('Password reset email sent! Check your inbox.');
                    })
                    .catch((err) => showAuthError(err))
                    .finally(() => { btn.disabled = false; });
                return;
            }

            const password = document.getElementById('auth-password').value;
            btn.disabled = true;

            if (authMode === 'signup') {
                auth.createUserWithEmailAndPassword(email, password)
                    .catch((err) => showAuthError(err))
                    .finally(() => { btn.disabled = false; });
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .catch((err) => {
                    showAuthError(err);
                })
                .finally(() => { btn.disabled = false; });
        }

        function handleLogout() {
            if (unsubscribeTransactions) unsubscribeTransactions();
            auth.signOut();
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('auth-form').reset();
                toggleForgotPassword(false);
                subscribeToTransactions(user.uid);
            } else {
                currentUser = null;
                transactions = [];
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        function subscribeToTransactions(uid) {
            if (unsubscribeTransactions) unsubscribeTransactions();

            unsubscribeTransactions = db.collection('users').doc(uid).collection('transactions')
                .onSnapshot((snapshot) => {
                    transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    transactions.sort((a, b) => (a.date > b.date ? 1 : (a.date < b.date ? -1 : 0)));
                    setSyncStatus('synced');
                    refreshUI();
                }, (err) => {
                    console.error('Sync error:', err);
                    setSyncStatus('offline');
                });
        }

            document.getElementById('lbl-to').innerText = t.lblTo;
            document.getElementById('settings-heading').innerHTML = `${icon('gear')} ${t.settingsHeading}`;
            document.getElementById('lbl-select-lang').innerText = t.lblSelectLang;
            document.getElementById('lbl-select-theme').innerText = t.lblSelectTheme;
            document.getElementById('btn-done').innerText = t.btnDone;

            const themeSelect = document.getElementById('theme-select');
            themeSelect.options[0].text = t.lightTheme;
            themeSelect.options[1].text = t.darkTheme;

            const typeSelect = document.getElementById('type');
            typeSelect.options[0].text = t.expenseOpt;
            typeSelect.options[1].text = t.incomeOpt;

            renderTransactions();
        }

        function addTransaction(e) {
            e.preventDefault();

            if (!currentUser) {
                setSyncStatus('offline');
                return;
            }

            const type = document.getElementById('type').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const date = document.getElementById('date').value;
            let desc = document.getElementById('desc').value;

            let finalDesc = desc ? desc : category;

            const newTx = {
                type,
                amount,
                category,
                paymentMethod,
                date,
                desc: finalDesc,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('users').doc(currentUser.uid).collection('transactions').add(newTx)
                .catch((err) => {
                    console.error('Error adding transaction:', err);
                    setSyncStatus('offline');
                });

            document.getElementById('expense-form').reset();
            document.getElementById('date').valueAsDate = new Date();
        }

        function deleteTransaction(id) {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('transactions').doc(id).delete()
                .catch((err) => {
                    console.error('Error deleting transaction:', err);
                    setSyncStatus('offline');
                });
        }

        function updateDashboard() {
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                else totalExpense += tx.amount;
            });

            const balance = totalIncome - totalExpense;

            document.getElementById('total-balance').innerText = `₹${balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            document.getElementById('total-income').innerText = `₹${totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            document.getElementById('total-expense').innerText = `₹${totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;

            const alertBox = document.getElementById('budget-alert');
            if (totalExpense >= MONTHLY_BUDGET_LIMIT * 0.8) {
                alertBox.classList.remove('hidden');
                document.getElementById('alert-text').innerText = `${currentLang === 'hi' ? 'चेतावनी: आपका खर्च (₹' + totalExpense + ') बजट सीमा के करीब या ऊपर है!' : 'Alert: Your expenses (₹' + totalExpense + ') are nearing or exceeding the budget limit!'}`;
            } else {
                alertBox.classList.add('hidden');
            }
        }

        function renderTransactions() {
            const listEl = document.getElementById('transaction-list');
            const filterVal = document.getElementById('filter-category').value;
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;
            const t = translations[currentLang] || translations['en'];
            
            let filtered = transactions;

            if (filterVal !== 'All') {
                filtered = filtered.filter(tx => tx.category === filterVal);
            }
            if (fromDate) {
                filtered = filtered.filter(tx => tx.date >= fromDate);
            }
            if (toDate) {
                filtered = filtered.filter(tx => tx.date <= toDate);
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-xs opacity-50 text-center py-6">${t.noTx}</p>`;
                return;
            }

            const isDark = currentTheme === 'dark';

            listEl.innerHTML = filtered.reverse().map(tx => `
                <div class="${isDark ? 'bg-slate-900/50 border-slate-800 text-slate-100' : 'bg-slate-50/80 border-slate-200/80 text-slate-900'} p-3.5 rounded-2xl border flex justify-between items-center text-xs shadow-sm">
                    <div class="space-y-1">
                        <p class="font-semibold">${tx.desc}</p>
                        <div class="flex items-center gap-2 text-[10px] opacity-70">
                            <span class="${isDark ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} px-2 py-0.5 rounded-lg border">${tx.category}</span>
                            <span>${icon('wallet', 'mr-1')}${tx.paymentMethod}</span>
                            <span>${icon('calendar', 'mr-1')}${tx.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm ${tx.type === 'income' ? 'text-emerald-500' : ''}">
                            ${tx.type === 'income' ? '+' : '-'}₹${tx.amount.toLocaleString('en-IN')}
                        </span>
                        <button onclick="deleteTransaction('${tx.id}')" class="opacity-50 hover:text-rose-500 hover:opacity-100 p-1 cursor-pointer transition">
                            ${icon('trash')}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            const categories = ['Food', 'Grocery', 'Rent', 'Transport', 'Electricity', 'Recharge', 'Medical', 'Shopping', 'Entertainment', 'Education', 'EMI', 'Salary', 'Other'];
            const categoryTotals = {};
            categories.forEach(c => categoryTotals[c] = 0);

            transactions.forEach(tx => {
                if (tx.type === 'expense' && categoryTotals[tx.category] !== undefined) {
                    categoryTotals[tx.category] += tx.amount;
                }
            });

            const dataValues = categories.map(c => categoryTotals[c]);

            if (expenseChartInstance) {
                expenseChartInstance.destroy();
            }

            const isDark = currentTheme === 'dark';

            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: [
                            '#38bdf8', '#334155', '#475569', '#64748b', '#0ea5e9', 
                            '#1e293b', '#60a5fa', '#34d399', '#818cf8', '#a78bfa', 
                            '#f472b6', '#fb7185', '#94a3b8'
                        ],
                        borderWidth: 2,
                        borderColor: isDark ? '#1e293b' : '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { 
                                color: isDark ? '#94a3b8' : '#334155', 
                                font: { size: 9, family: "'Outfit', sans-serif" } 
                            }
                        }
                    }
                }
            });
        }

        applyTranslations();
        setSyncStatus('syncing');
    </script>
</body>
</html>
